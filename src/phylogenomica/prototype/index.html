<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phylogenomica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1218; --panel: #161c25; --line: #253044; --ink: #e7ecf3;
    --muted: #8f9cb0; --faint: #4a5568; --accent: #6ea8fe;
    --good: #58c98a; --warn: #e0a458;
    --font: "Solway", Georgia, serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --line: #d7dee8; --ink: #16202e;
      --muted: #5d6b7f; --faint: #a6b1c0; --accent: #2c6fd1;
      --good: #1f8a55; --warn: #9a5f0d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 var(--font);
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: baseline;
    padding: .7rem 1.1rem; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: 0 0 auto;
  }
  h1 { font-size: .95rem; margin: 0; letter-spacing: .09em; text-transform: uppercase; }
  h1 span { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .media-status {
    color: var(--muted); font-size: .72rem; letter-spacing: .02em;
    white-space: nowrap;
  }
  .difficulty {
    display: flex; gap: .15rem; padding: .15rem;
    border: 1px solid var(--line); border-radius: .4rem; background: var(--bg);
  }
  .difficulty button {
    border: 0; background: transparent; color: var(--muted); font: inherit;
    font-size: .72rem; letter-spacing: .05em; text-transform: uppercase;
    padding: .22rem .55rem; border-radius: .28rem; cursor: pointer;
  }
  .difficulty button:hover { color: var(--ink); }
  .difficulty button[aria-pressed="true"] {
    background: var(--panel); color: var(--accent); font-weight: 700;
  }
  .stats { display: flex; gap: 1.4rem; margin-left: auto; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat small { color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; }

  /* The tree is the board: it takes every pixel the chrome does not need.
     The overlays sit on the wrapper, so they stay put while the tree scrolls. */
  #board { flex: 1 1 auto; position: relative; min-height: 0; }
  #stage-tree { position: absolute; inset: 0; overflow: auto; display: flex; }
  /* auto margins centre the tree without clipping it once it outgrows the box.
     flex: 0 0 auto is load-bearing: a flex item would otherwise shrink to fit
     the container instead of overflowing into a scroll, silently shrinking the
     whole cladogram as stages accumulate. */
  #stage-tree svg { display: block; margin: auto; flex: 0 0 auto; }
  .empty { margin: auto; color: var(--muted); font-style: italic; }
  .controls {
    position: absolute; top: .6rem; right: .8rem; z-index: 3; display: flex; gap: .3rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: .4rem; padding: .2rem;
  }
  .controls button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .78rem;
    padding: .2rem .5rem; border-radius: .25rem; cursor: pointer;
  }
  .controls button:hover { color: var(--ink); background: var(--bg); }
  .controls button[aria-pressed="true"] { color: var(--accent); background: var(--bg); }

  .legend {
    position: absolute; bottom: .6rem; left: .8rem; z-index: 3; display: flex;
    flex-wrap: wrap; gap: .1rem .8rem; font-size: .7rem; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: .4rem; padding: .35rem .6rem; max-width: 30rem;
  }
  .legend i { font-style: normal; color: var(--ink); }

  footer {
    flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel);
    padding: .6rem .9rem .75rem;
  }
  #feedback {
    margin: 0 0 .55rem; padding: .4rem .7rem; border-radius: .4rem;
    border: 1px solid var(--line); background: var(--bg); font-size: .88rem;
    font-variant-numeric: tabular-nums;
  }
  #feedback.good { border-color: var(--good); }
  #feedback.cost { border-color: var(--warn); }
  /* The revealed target is pinned outside the scrolling tray: it is the
     question, not one of the answers, and must stay on screen. */
  .tray { display: flex; gap: .6rem; align-items: stretch; min-width: 0; }
  #cards {
    display: flex; gap: .5rem; align-items: stretch; flex: 1 1 auto;
    min-width: 0; overflow-x: auto; padding-bottom: .2rem;
  }
  #target-panel {
    flex: 0 0 auto; display: flex; gap: .5rem; align-items: stretch;
    padding-right: .6rem; border-right: 1px solid var(--line);
  }
  #target-panel .card { border-color: var(--good); background: var(--panel); }
  #target-panel .card:hover { transform: none; border-color: var(--good); }
  .tray-label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: .6rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--good); font-weight: 700; text-align: center;
  }
  .card {
    flex: 1 0 8.25rem; min-width: 8.25rem; max-width: 12rem;
    display: flex; flex-direction: column; gap: .4rem; align-items: stretch;
    text-align: center; padding: .45rem; border: 1px solid var(--line); border-radius: .45rem;
    background: var(--bg); color: inherit; font: inherit; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .card:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
  .card:disabled { cursor: default; }
  .card.guessed, .card.revealed {
    background: var(--panel); border-color: var(--faint); color: var(--muted);
    filter: grayscale(1); opacity: .62;
  }
  .card.guessed .thumb img, .card.revealed .thumb img {
    filter: grayscale(1) contrast(.65); opacity: .38;
  }
  /* A card the player was never allowed to spend is not a spent card. */
  .card.shown, .card.shown .thumb img { filter: none; opacity: 1; }
  .card.shown { border-color: var(--good); color: inherit; }
  .thumb {
    flex: 0 0 auto; width: 100%; aspect-ratio: 4 / 3;
    position: relative; border-radius: .3rem; overflow: hidden;
    background: linear-gradient(160deg, var(--line), var(--panel));
    display: grid; place-items: center; font-size: 2rem; color: var(--muted);
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .state-badge {
    position: absolute; inset: auto .3rem .3rem; padding: .16rem .25rem;
    border-radius: .2rem; background: rgba(20, 24, 30, .82); color: #d8dce2;
    font-size: .58rem; font-weight: 700; letter-spacing: .08em;
    text-align: center; text-transform: uppercase;
  }
  .state-badge.target { background: rgba(31, 138, 85, .92); color: #f2fff8; }
  .en { font-weight: 600; font-size: .85rem; line-height: 1.2; }
  .sci { font-style: italic; color: var(--muted); font-size: .74rem; line-height: 1.2; }
  .credit { color: var(--muted); font-size: .62rem; line-height: 1.2; }
  .meta { min-width: 0; width: 100%; }
  .meta > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .en { white-space: normal; overflow-wrap: anywhere; }
  .again {
    margin-left: .5rem; padding: .45rem .9rem; border-radius: .4rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  .continue-stage {
    margin-left: .65rem; padding: .3rem .7rem; border-radius: .35rem;
    border: 1px solid var(--good); background: var(--panel); color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }

  /* The completion summary takes over the tray: there are no cards left to
     deal, so the space belongs to what the target actually was. */
  .summary {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
    gap: .3rem; padding: .5rem .75rem; border: 1px solid var(--line);
    border-radius: .45rem; background: var(--bg);
    max-height: 11.5rem; overflow-y: auto;
  }
  .summary h2 { margin: 0; font-size: .95rem; font-weight: 700; }
  .summary h2 em {
    font-style: italic; font-weight: 400; color: var(--muted); font-size: .82rem;
  }
  .summary .blurb { margin: 0; font-size: .82rem; line-height: 1.4; }
  .summary .pending { margin: 0; font-size: .82rem; color: var(--muted); font-style: italic; }
  .source { font-size: .64rem; color: var(--muted); line-height: 1.3; }
  .source a { color: var(--accent); }
  .again.final {
    flex: 0 0 auto; align-self: stretch; width: 9.5rem; margin-left: .1rem;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: .15rem; font-weight: 700;
  }
  .again.final small {
    font-weight: 400; font-size: .68rem; color: var(--muted);
    letter-spacing: .04em; text-transform: uppercase;
  }

  /* Hover detail: an enlarged look at any species already on screen. It never
     takes pointer events, so it can overlap a card without blocking the click. */
  #detail {
    position: fixed; z-index: 20; width: 22rem; max-width: calc(100vw - 1.5rem);
    padding: .6rem; border: 1px solid var(--line); border-radius: .5rem;
    background: var(--panel); box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
    pointer-events: none; display: flex; gap: .6rem;
  }
  #detail[hidden] { display: none; }
  #detail .shot {
    flex: 0 0 7.5rem; width: 7.5rem; aspect-ratio: 4 / 3; border-radius: .35rem;
    overflow: hidden; background: linear-gradient(160deg, var(--line), var(--panel));
    display: grid; place-items: center; font-size: 1.7rem; color: var(--muted);
  }
  #detail .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #detail .body { flex: 1 1 auto; min-width: 0; }
  #detail .en { font-size: .9rem; }
  #detail .sci { margin-bottom: .3rem; }
  #detail .blurb {
    font-size: .76rem; line-height: 1.36;
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #detail .pending { font-size: .76rem; font-style: italic; color: var(--muted); }
  #detail .source { margin-top: .3rem; }
</style>
</head>
<body>
<header>
  <h1>Phylogenomica <span id="stage"></span></h1>
  <span id="media-status" class="media-status" hidden></span>
  <div class="difficulty" role="group" aria-label="Difficulty">
    <button type="button" data-difficulty="expert" aria-pressed="true"
      title="The target stays hidden until the last stage, and every stage deals a mulligan">
      Expert</button>
    <button type="button" data-difficulty="guided" aria-pressed="false"
      title="The target is shown from the start; name its closest relative each stage">
      Guided</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="score">0</b><small>score</small></div>
  </div>
</header>

<div id="board">
  <div class="controls">
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="fit">Fit all</button>
    <button id="follow" aria-pressed="true">Follow</button>
  </div>
  <div class="legend">
    <span>● <i>inferred</i> — you placed it</span>
    <span>○ <i>revealed</i> — the game placed it</span>
    <span>— <i>resolved</i></span>
    <span>--- <i>unresolved</i></span>
    <span>⌐ <i>polytomy</i> — one event, no order</span>
  </div>
  <div id="stage-tree"></div>
</div>

<footer>
  <p id="feedback">Pick the closest relative to the hidden target species.</p>
  <div class="tray">
    <div id="target-panel" hidden></div>
    <div id="cards"></div>
  </div>
</footer>

<div id="detail" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const MIN_TREE_WIDTH = 720, LABEL_WIDTH = 250;
const BRANCH_LEFT = 72, TREE_TOP = 50, TREE_BOTTOM = 44;
const HISTORY_STAGE_WIDTH = 152;
// A completed tree is read, not played: every stage gets room for its own
// labels, and the board scrolls rather than compressing them away.
const EXPANDED_STAGE_WIDTH = 200, EXPANDED_LEAF_HEIGHT = 30;
const DETAIL_DELAY = 320;
const SLOT_HINTS = { mulligan: "+1", unlock: "guess me" };
let scale = 1, follow = true, busy = false;
let currentView = null, resizeTimer = null, mediaTimer = null;
let detailTimer = null, detailIndex = new Map(), expandedOnce = false;

function el(name, attrs = {}) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

function text(x, y, value, cls, anchor) {
  const node = el("text", { x, y, class: cls });
  if (anchor) node.setAttribute("text-anchor", anchor);
  node.textContent = value;
  return node;
}

// SVG has no text wrapping, so clip to the column width by character estimate.
function fit(value, maxPx, perChar) {
  const max = Math.floor(maxPx / perChar);
  return value.length <= max ? value : value.slice(0, Math.max(1, max - 1)) + "…";
}

// Ages span 4000 Ma to under 1 Ma, so significant figures beat fixed decimals.
function formatAge(age) {
  // Source ages carry artefacts like 25.000001, so round before trimming.
  if (age >= 100) return `${Math.round(age)} Ma`;
  if (age >= 10) return `${Number(age.toFixed(1))} Ma`;
  return `${Number(age.toPrecision(2))} Ma`;
}

function columns(view) {
  const cols = [];
  for (const stage of view.lineage) {
    for (const tier of stage.tiers) {
      cols.push({
        stage: stage.stage_index, tier: tier.tier_index,
        age: tier.age_ma, clade: tier.clade_name, species: tier.species,
        populated: tier.populated !== undefined
          ? tier.populated
          : tier.species.length > 0,
        slotRole: tier.slot_role || null,
        slotCount: Number.isInteger(tier.slot_count)
          ? tier.slot_count
          : tier.species.length,
      });
    }
  }
  return cols;
}

function renderTree(view) {
  const host = $("stage-tree");
  for (const old of host.querySelectorAll("svg, .empty")) old.remove();

  const tiers = columns(view);
  if (!tiers.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "The tree grows here as you place relatives.";
    host.appendChild(empty);
    return;
  }

  const targets = view.lineage.flatMap((stage) => stage.target);
  const target = targets.length ? targets[0] : null;
  const focusStage = view.completed ? view.stage_count - 1 : view.stage_index;
  // A finished game has no next move to focus on, so no stage is history any
  // more. Every branching event reopens with its name, age, and species.
  const expanded = Boolean(view.completed);
  const leafCount =
    tiers.reduce((total, tier) => total + tier.slotCount, 0) + 1;
  const width = Math.max(
    MIN_TREE_WIDTH,
    host.clientWidth || MIN_TREE_WIDTH,
    expanded
      ? BRANCH_LEFT + (focusStage + 1) * EXPANDED_STAGE_WIDTH + LABEL_WIDTH
      : 0,
  );
  const height = Math.max(
    360,
    expanded
      ? TREE_TOP + TREE_BOTTOM + leafCount * EXPANDED_LEAF_HEIGHT
      : host.clientHeight || 520,
  );
  const leafX = width - LABEL_WIDTH;
  const branchRight = leafX - 38;
  const branchWidth = branchRight - BRANCH_LEFT;
  const historyStageCount = expanded ? 0 : focusStage;
  const historyWidth = historyStageCount
    ? Math.min(branchWidth * 0.68, historyStageCount * HISTORY_STAGE_WIDTH)
    : 0;
  const historyStageWidth = historyStageCount
    ? historyWidth / historyStageCount
    : 0;
  const focusWidth = branchWidth - historyWidth;

  // Completed stages are narrow historical bands. The current stage receives
  // the rest of the horizontal branching space, regardless of how deep its
  // selected tier indexes happen to be in the generator's internal model.
  const layout = tiers.map((tier) => {
    const speciesBySlot = new Map(
      tier.species.map((species) => [species.slot_index, species]),
    );
    return {
      ...tier,
      // Anonymous slots reserve the complete current-stage geometry. A placed
      // species fills its deterministic slot without moving existing leaves.
      leaves: Array.from({ length: tier.slotCount }, (_, slotIndex) => ({
        species: speciesBySlot.get(slotIndex) || null,
        slotIndex,
      })),
    };
  });
  const stageBands = [];
  let stageStart = BRANCH_LEFT;
  for (let stage = 0; stage <= focusStage; stage++) {
    const stageWidth = expanded
      ? branchWidth / (focusStage + 1)
      : stage < focusStage ? historyStageWidth : focusWidth;
    const stageTiers = layout.filter((tier) => tier.stage === stage);
    stageTiers.forEach((tier, index) => {
      tier.x = stageStart + stageWidth * (index + 1) / (stageTiers.length + 1);
    });
    stageBands.push({ stage, start: stageStart, end: stageStart + stageWidth });
    stageStart += stageWidth;
  }

  // Terminal leaves share one right-hand boundary. Historical species occupy
  // a shallow compressed band; the focus stage gets the remaining height and
  // readable labels.
  const historyLeaves = expanded
    ? []
    : layout.filter((tier) => tier.stage < focusStage).flatMap((t) => t.leaves);
  const focusLeaves = expanded
    ? layout.flatMap((tier) => tier.leaves)
    : layout.filter((tier) => tier.stage === focusStage).flatMap((t) => t.leaves);
  const endpoint = { y: 0 };
  const historyEnd = historyLeaves.length
    ? Math.min(TREE_TOP + height * 0.36, height - TREE_BOTTOM - 150)
    : TREE_TOP;
  distributeLeaves(historyLeaves, TREE_TOP, historyEnd);
  const focusStart = historyLeaves.length ? historyEnd + 28 : TREE_TOP;
  distributeLeaves([...focusLeaves, endpoint], focusStart, height - TREE_BOTTOM);

  // Work back from the hidden target. Internal nodes sit midway between their
  // outermost children, producing a conventional rectangular cladogram.
  let continuationY = endpoint.y;
  for (let i = layout.length - 1; i >= 0; i--) {
    const childYs = layout[i].leaves.map((leaf) => leaf.y);
    childYs.push(continuationY);
    layout[i].continuationY = continuationY;
    layout[i].nodeY = (Math.min(...childYs) + Math.max(...childYs)) / 2;
    continuationY = layout[i].nodeY;
  }

  const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, width, height });
  svg.appendChild(styleBlock());

  stageBands.forEach((band) => {
    const active = band.stage === focusStage;
    svg.appendChild(el("line", {
      x1: band.start + 5, y1: 34, x2: band.end - 5, y2: 34,
      class: active ? "stage-bracket active" : "stage-bracket",
    }));
    svg.appendChild(text(
      (band.start + band.end) / 2, 24, `STAGE ${band.stage + 1}`,
      active ? "stagelabel active" : "stagelabel", "middle",
    ));
  });

  const root = layout[0];
  svg.appendChild(el("line", {
    x1: 22, y1: root.nodeY, x2: root.x, y2: root.nodeY, class: "edge",
  }));
  svg.appendChild(text(22, root.nodeY - 10, "Life", "en"));

  layout.forEach((tier, i) => {
    const childYs = tier.leaves.map((leaf) => leaf.y);
    childYs.push(tier.continuationY);
    const topY = Math.min(...childYs);
    const bottomY = Math.max(...childYs);

    // All children at one tier leave the same branching event.
    svg.appendChild(el("line", {
      x1: tier.x, y1: topY, x2: tier.x, y2: bottomY, class: "edge branch-event",
    }));
    const polytomy = tier.leaves.length > 1;
    const branchNode = el("circle", {
      cx: tier.x, cy: tier.nodeY, r: polytomy ? 5 : 3.5,
      class: polytomy ? "node polytomy" : "node",
    });
    svg.appendChild(branchNode);
    const labelParts = [];
    if (tier.clade) labelParts.push(tier.clade);
    if (tier.age !== null && tier.age !== undefined) labelParts.push(formatAge(tier.age));
    if (labelParts.length) {
      const fullLabel = labelParts.join(" · ");
      branchNode.appendChild(el("title")).textContent = fullLabel;
      // An age on an empty event is dated but unidentified: keep it visibly
      // provisional so it never reads as a placed relative's own label.
      const classes = ["tierlabel"];
      if (!expanded && tier.stage < focusStage) classes.push("history");
      if (!tier.populated) classes.push("pending");
      const labelNode = text(
        tier.x + 7, tier.nodeY - 7, fit(fullLabel, 180, 5.8),
        classes.join(" "),
      );
      labelNode.appendChild(el("title")).textContent = fullLabel;
      svg.appendChild(labelNode);
    }

    const labelled = expanded || tier.stage === focusStage;
    tier.leaves.forEach(({ species, y }) => {
      svg.appendChild(el("line", {
        x1: tier.x, y1: y, x2: leafX, y2: y,
        class: species ? "edge" : "edge unresolved",
      }));
      if (!species) {
        svg.appendChild(el("circle", {
          cx: leafX, cy: y, r: labelled ? 4 : 2.5, class: "tip unknown-tip",
        }));
        if (labelled && tier.slotRole) {
          svg.appendChild(text(
            leafX + 10, y + 4, SLOT_HINTS[tier.slotRole],
            `slot-hint ${tier.slotRole}`,
          ));
        }
        return;
      }
      svg.appendChild(el("circle", {
        cx: leafX, cy: y, r: labelled ? 4 : 2.5,
        class: `tip ${species.placement}${species.role === "target" ? " target" : ""}`,
      }));
      if (labelled) appendLeafLabel(svg, leafX, y, species);
      else appendLeafHit(svg, leafX, y, species);
    });

    // The continuing child is the next nested branching event. The last one
    // reaches either the target or a deliberately unresolved endpoint.
    if (i < layout.length - 1) {
      svg.appendChild(el("line", {
        x1: tier.x, y1: tier.continuationY,
        x2: layout[i + 1].x, y2: tier.continuationY, class: "edge",
      }));
    }
  });

  const lastTier = layout[layout.length - 1];
  svg.appendChild(el("line", {
    x1: lastTier.x, y1: endpoint.y, x2: leafX, y2: endpoint.y,
    class: target ? "edge" : "edge unresolved",
  }));
  if (target) {
    svg.appendChild(el("circle", {
      cx: leafX, cy: endpoint.y, r: 6, class: "tip target guessed",
    }));
    appendLeafLabel(svg, leafX, endpoint.y, target);
  } else if (view.target) {
    // Guided play knows where the lineage ends from the first stage. The
    // endpoint is named, but the branch reaching it stays dashed until the
    // relatives between here and there are placed.
    svg.appendChild(el("circle", {
      cx: leafX, cy: endpoint.y, r: 6, class: "tip target pending",
    }));
    appendLeafLabel(svg, leafX, endpoint.y, {
      species_id: view.target.species_id,
      english_name: view.target.english_name,
      scientific_name: view.target.scientific_name,
      role: "target",
      placement: "revealed",
    });
  } else {
    svg.appendChild(el("circle", {
      cx: leafX, cy: endpoint.y, r: 5, class: "tip unknown-tip",
    }));
    svg.appendChild(text(leafX + 10, endpoint.y + 4, "target clade", "unknown"));
  }

  host.appendChild(svg);
  applyScale();
}

function distributeLeaves(leaves, start, end) {
  if (!leaves.length) return;
  if (leaves.length === 1) {
    leaves[0].y = (start + end) / 2;
    return;
  }
  leaves.forEach((leaf, index) => {
    leaf.y = start + (end - start) * index / (leaves.length - 1);
  });
}

// Leaf labels open the same detail popup the cards do, so a name in the tree
// is a way back to the animal rather than a dead end. The native title is
// deliberately absent: it would race the popup with a second tooltip.
function appendLeafLabel(svg, x, y, species) {
  const en = text(x + 10, y - 2, fit(species.english_name, 225, 6.3),
    `en ${species.role} leaf`);
  const sci = text(x + 10, y + 11, fit(species.scientific_name, 225, 5.7),
    "sci leaf");
  svg.appendChild(en);
  svg.appendChild(sci);
  attachDetail(en, species);
  attachDetail(sci, species);
}

function appendLeafHit(svg, x, y, species) {
  const hit = el("circle", { cx: x, cy: y, r: 7, class: "history-hit" });
  svg.appendChild(hit);
  attachDetail(hit, species);
}

function styleBlock() {
  const style = el("style");
  style.textContent = `
    .edge { stroke: var(--line); stroke-width: 1.8; fill: none; }
    .edge.unresolved { stroke: var(--faint); stroke-dasharray: 6 6; }
    .branch-event { stroke: var(--accent); stroke-width: 2.2; }
    .node { fill: var(--accent); }
    .node.polytomy { fill: none; stroke: var(--accent); stroke-width: 2; }
    .tip { fill: var(--bg); stroke: var(--faint); stroke-width: 2; }
    .tip.guessed { fill: var(--accent); stroke: var(--accent); }
    .tip.target { fill: var(--good); stroke: var(--good); }
    /* Named but not yet reached: the endpoint is known, the path is not. */
    .tip.target.pending { fill: var(--bg); stroke-dasharray: 3 2; }
    .tip.unknown-tip { fill: var(--bg); stroke-dasharray: 2 2; }
    .history-hit { fill: transparent; stroke: none; cursor: help; }
    .leaf { cursor: help; }
    .stage-bracket { stroke: var(--line); stroke-width: 1.2; }
    .stage-bracket.active { stroke: var(--accent); stroke-width: 2; }
    text { font: 11.5px var(--font); fill: var(--ink); }
    .en { font-weight: 600; }
    .en.mulligan { fill: var(--warn); }
    .en.unlock, .en.target { fill: var(--good); }
    .slot-hint, .unknown {
      fill: var(--muted); font-size: 15px; font-style: italic; font-weight: 400;
    }
    .sci { font-size: 10px; font-style: italic; fill: var(--muted); }
    .tierlabel, .stagelabel { font-size: 9.5px; fill: var(--muted); letter-spacing: .04em; }
    .tierlabel.history { display: none; }
    .tierlabel.pending { fill: var(--faint); font-style: italic; }
    .stagelabel.active { fill: var(--accent); font-weight: 700; }
    /* Zoomed far out, labels are unreadable noise: show structure instead. */
    .compact .en, .compact .sci, .compact .tierlabel,
    .compact .slot-hint { display: none; }
    .compact .stagelabel { font-size: 22px; }
  `;
  return style;
}

function applyScale() {
  const svg = $("stage-tree").querySelector("svg");
  if (!svg) return;
  const box = svg.viewBox.baseVal;
  svg.setAttribute("width", box.width * scale);
  svg.setAttribute("height", box.height * scale);
  svg.classList.toggle("compact", scale < 0.55);
  if (follow) {
    $("stage-tree").scrollLeft = $("stage-tree").scrollWidth;
    $("stage-tree").scrollTop = $("stage-tree").scrollHeight;
  }
}

// Every species already on screen — dealt cards, the revealed target, and
// every leaf in the tree — is described in one index the popup reads from.
// Cards and lineage entries describe the same species from different angles,
// so neither may erase what the other supplied.
function buildDetailIndex(view) {
  const index = new Map();
  const add = (entry) => {
    if (!entry || entry.species_id === null || entry.species_id === undefined) return;
    const merged = { ...(index.get(entry.species_id) || {}) };
    for (const [key, value] of Object.entries(entry)) {
      if (value !== null && value !== undefined) merged[key] = value;
    }
    index.set(entry.species_id, merged);
  };
  for (const stage of view.lineage || []) {
    for (const tier of stage.tiers) for (const species of tier.species) add(species);
    for (const placed of stage.target) add(placed);
  }
  for (const card of view.cards || []) add(card);
  add(view.target);
  return index;
}

// Article text and image carry separate licences, so both credits travel with
// the species wherever it is shown.
function sourceLine(entry) {
  const parts = [];
  if (entry.description && entry.description.attribution) {
    parts.push(entry.description.attribution);
  }
  const image = entry.image_attribution && entry.image_attribution.text;
  if (image) parts.push(`Image: ${image}`);
  else if (entry.rights) parts.push(`Image: ${entry.rights}`);
  return parts.join(" · ");
}

function renderDetail(entry) {
  const box = $("detail");
  box.innerHTML = "";
  const shot = document.createElement("div");
  shot.className = "shot";
  if (entry.image_url) {
    const img = document.createElement("img");
    img.alt = "";
    img.src = entry.image_url;
    img.onerror = () => { shot.textContent = "🧬"; };
    shot.appendChild(img);
  } else {
    shot.textContent = "🧬";
  }
  const body = document.createElement("div");
  body.className = "body";
  const en = document.createElement("div");
  en.className = "en";
  en.textContent = entry.english_name || "";
  const sci = document.createElement("div");
  sci.className = "sci";
  sci.textContent = entry.scientific_name || "";
  const blurb = document.createElement("div");
  if (entry.description && entry.description.text) {
    blurb.className = "blurb";
    blurb.textContent = entry.description.text;
  } else {
    blurb.className = "pending";
    blurb.textContent = "No description available for this species yet.";
  }
  body.append(en, sci, blurb);
  const source = sourceLine(entry);
  if (source) {
    const credit = document.createElement("div");
    credit.className = "source";
    credit.textContent = source;
    body.appendChild(credit);
  }
  box.append(shot, body);
}

function placeDetail(anchor) {
  const box = $("detail");
  const rect = anchor.getBoundingClientRect();
  const margin = 10;
  const width = box.offsetWidth, height = box.offsetHeight;
  let top = rect.top - height - margin;
  if (top < margin) top = rect.bottom + margin;
  top = Math.max(margin, Math.min(top, window.innerHeight - height - margin));
  let left = rect.left + rect.width / 2 - width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));
  box.style.top = `${top}px`;
  box.style.left = `${left}px`;
}

function hideDetail() {
  clearTimeout(detailTimer);
  detailTimer = null;
  $("detail").hidden = true;
}

// Hovering is a lingering gesture, not a click: wait before interrupting the
// board with a popup, and drop it the moment the pointer leaves.
function attachDetail(node, species) {
  const speciesId = species && species.species_id;
  if (speciesId === null || speciesId === undefined) return;
  const open = () => {
    renderDetail(detailIndex.get(speciesId) || species);
    $("detail").hidden = false;
    placeDetail(node);
  };
  node.addEventListener("mouseenter", () => {
    clearTimeout(detailTimer);
    detailTimer = setTimeout(open, DETAIL_DELAY);
  });
  node.addEventListener("mouseleave", hideDetail);
  node.addEventListener("focus", open);
  node.addEventListener("blur", hideDetail);
}

function cardNode(card) {
  const node = document.createElement("button");
  // A dealt card the server marks unselectable is guided play's revealed
  // target: shown in full colour, but never a choice.
  const shown = !card.selectable && card.state === "revealed" && card.role === "target";
  node.className = `card ${card.state}${shown ? " shown" : ""}`;
  // `busy` is deliberately not consulted here. Every click handler already
  // returns early while a request is in flight, and a render that ran during
  // one would otherwise leave permanently disabled cards behind.
  node.disabled = !card.selectable;

  const thumb = document.createElement("div");
  thumb.className = "thumb";
  if (card.image_url) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = card.image_url;
    img.onerror = () => { thumb.textContent = "🧬"; };
    thumb.appendChild(img);
  } else {
    thumb.textContent = "🧬";
  }
  if (card.state !== "active") {
    const badge = document.createElement("div");
    const isTarget = card.role === "target";
    badge.className = `state-badge${isTarget ? " target" : ""}`;
    badge.textContent = isTarget ? "target" : card.state;
    thumb.appendChild(badge);
  }

  const meta = document.createElement("div");
  meta.className = "meta";
  const en = document.createElement("div");
  en.className = "en";
  en.textContent = card.english_name;
  const sci = document.createElement("div");
  sci.className = "sci";
  sci.textContent = card.scientific_name;
  meta.append(en, sci);
  if (card.image_attribution) {
    const credit = document.createElement("div");
    credit.className = "credit";
    credit.textContent = card.license;
    credit.title = card.image_attribution.text;
    meta.appendChild(credit);
  }
  node.append(thumb, meta);
  attachDetail(node, card);
  if (card.selectable) node.onclick = () => guess(card.species_id);
  return node;
}

// The target panel is the question guided play puts on screen. It stays put
// through every stage, so the player always sees what they are placing
// relatives against.
function renderTargetPanel(view) {
  const panel = $("target-panel");
  panel.innerHTML = "";
  panel.hidden = !view.target;
  if (!view.target) return;
  const label = document.createElement("div");
  label.className = "tray-label";
  label.textContent = "target";
  panel.append(label, cardNode(view.target));
}

// A finished game has no cards left to deal, so the tray becomes the answer:
// the target on the left, what it actually is in the middle, and the way out
// on the right.
function renderSummary(view) {
  const cards = $("cards");
  const target = view.target;
  const summary = document.createElement("div");
  summary.className = "summary";
  const heading = document.createElement("h2");
  if (target) {
    heading.textContent = `${target.english_name} `;
    const sci = document.createElement("em");
    sci.textContent = target.scientific_name;
    heading.appendChild(sci);
  } else {
    heading.textContent = "Lineage complete";
  }
  summary.appendChild(heading);

  const description = target && target.description;
  const blurb = document.createElement("div");
  if (description && description.text) {
    blurb.className = "blurb";
    blurb.textContent = description.text;
  } else {
    blurb.className = "pending";
    blurb.textContent =
      "No Wikipedia description has been fetched for this species yet.";
  }
  summary.appendChild(blurb);

  if (description) {
    const credit = document.createElement("div");
    credit.className = "source";
    credit.textContent = description.attribution;
    if (description.url) {
      credit.append(" — ");
      const link = document.createElement("a");
      link.href = description.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "read on Wikipedia";
      credit.appendChild(link);
    }
    summary.appendChild(credit);
  }
  cards.appendChild(summary);

  const again = document.createElement("button");
  again.className = "again final";
  again.append("Play again");
  const note = document.createElement("small");
  note.textContent = `${view.score} / ${view.maximum}`;
  again.appendChild(note);
  again.onclick = playAgain;
  cards.appendChild(again);
}

function renderDifficulty(view) {
  for (const button of document.querySelectorAll(".difficulty button")) {
    button.setAttribute(
      "aria-pressed", String(button.dataset.difficulty === view.difficulty),
    );
  }
}

function openingPrompt(view) {
  return view.difficulty === "guided"
    ? "Pick the closest relative to the target species."
    : "Pick the closest relative to the hidden target species.";
}

function render(view, outcome) {
  currentView = view;
  detailIndex = buildDetailIndex(view);
  hideDetail();
  renderDifficulty(view);
  renderTargetPanel(view);
  $("score").textContent = `${view.score}/${view.maximum}`;
  $("stage").textContent = view.completed
    ? "complete"
    : view.reviewing_stage
      ? `stage ${view.stage_index + 1} complete`
      : `stage ${view.stage_index + 1} of ${view.stage_count}`;

  const cards = $("cards");
  cards.innerHTML = "";
  // Keep every card in its original tray slot for the entire stage. Placed
  // cards become disabled but do not disappear or cause their peers to resize.
  for (const card of view.cards) {
    cards.appendChild(cardNode(card));
  }
  if (view.completed) renderSummary(view);

  // Reopening the whole tree is a change of mode, not a redraw: reset the
  // viewport once, then leave the player's zoom and scroll alone.
  const reopening = view.completed && !expandedOnce;
  if (reopening) {
    expandedOnce = true;
    follow = false;
    scale = 1;
    $("follow").setAttribute("aria-pressed", "false");
  }
  renderTree(view);
  if (reopening) {
    $("stage-tree").scrollTop = 0;
    $("stage-tree").scrollLeft = 0;
  }
  updateMediaStatus(view);
  if (outcome) describe(outcome, view);
  else if (view.completed) {
    $("feedback").className = "good";
    $("feedback").textContent =
      `Final score ${view.score} of ${view.maximum}.`;
  } else if (view.reviewing_stage) {
    const stageScore = view.stage_scores[view.stage_scores.length - 1];
    $("feedback").className = "good";
    $("feedback").textContent =
      `Stage score: ${stageScore}.`;
  }
  appendContinue(view);
}

function appendContinue(view) {
  const box = $("feedback");
  for (const old of box.querySelectorAll(".continue-stage")) old.remove();
  if (!view.reviewing_stage) return;
  const button = document.createElement("button");
  button.className = "continue-stage";
  button.textContent = `Continue to stage ${view.stage_index + 2}`;
  button.onclick = continueStage;
  box.appendChild(button);
}

const ACTIVITY = {
  queued: "queued",
  resolving: "finding sources…",
  downloading: "downloading…",
  error: "failed",
};

function isFetching(status) {
  return ["queued", "resolving", "downloading"].includes(status.state);
}

function statusPart(label, status) {
  const count = `${label} ${status.available_count}/${status.total_count}`;
  const activity = ACTIVITY[status.state];
  return activity ? `${count} ${activity}` : count;
}

// Images and descriptions are fetched by independent workers, so the header
// reports whichever of them is still running.
function updateMediaStatus(view) {
  const box = $("media-status");
  clearTimeout(mediaTimer);
  mediaTimer = null;
  const parts = [];
  let fetching = false;
  for (const [label, status] of [
    ["images", view.media_download],
    ["text", view.description_download],
  ]) {
    if (!status || !status.enabled || status.total_count === 0) continue;
    parts.push(statusPart(label, status));
    fetching = fetching || isFetching(status);
  }
  if (!parts.length) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  box.textContent = parts.join(" · ");
  if (fetching) mediaTimer = setTimeout(refreshMedia, 1000);
}

async function refreshMedia() {
  if (busy) {
    mediaTimer = setTimeout(refreshMedia, 500);
    return;
  }
  try {
    const res = await fetch("/api/view");
    if (!res.ok) return;
    const view = await res.json();
    const changed = ["media_download", "description_download"].some((key) => {
      const previous = currentView && currentView[key];
      const next = view[key];
      if (!previous || !next) return Boolean(previous) !== Boolean(next);
      return previous.revision !== next.revision ||
        previous.available_count !== next.available_count;
    });
    if (changed) render(view);
    else {
      currentView.media_download = view.media_download;
      currentView.description_download = view.description_download;
      updateMediaStatus(currentView);
    }
  } catch (_) {
    mediaTimer = setTimeout(refreshMedia, 1500);
  }
}

// Every guess pays for what it resolved, so the running score never falls.
function plus(earned) {
  return earned ? `+${earned}` : "+0";
}

function describe(outcome, view) {
  const box = $("feedback");
  box.className = "";
  const revealed = outcome.placed.filter((p) => p.placement === "revealed").length;
  if (outcome.game_completed) {
    box.classList.add("good");
    // Guided play ends on the closest relative; expert play ends on the target.
    box.textContent =
      (outcome.role === "target"
        ? "You guessed the target! "
        : "Correct — you found the closest relative. ") +
      `Your final score is ${view.score} of ${view.maximum}.`;
  } else if (outcome.stage_completed) {
    box.classList.add("good");
    box.textContent =
      "Correct — you found the deepest branch. " +
      (outcome.earned ? `${plus(outcome.earned)}, ` : "") +
      (outcome.perfect_stage ? "+ 1 bonus point. " : "") +
      `Stage score ${outcome.stage_score}.`;
  } else if (outcome.role === "mulligan") {
    box.classList.add("good");
    box.textContent =
      `Close enough. ${plus(outcome.earned)}.`;
  } else {
    box.classList.add("cost");
    box.textContent =
      `Good guess. ${plus(outcome.earned)} points — ` +
      (revealed
        ? `${revealed} relative(s) are more distant. `
        : "") +
      `${outcome.remaining} card(s) left.`;
  }
}

async function guess(speciesId) {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/guess", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ species_id: speciesId }),
    });
    const data = await res.json();
    if (!res.ok) { $("feedback").textContent = data.error; return; }
    render(data.view, data.outcome);
  } finally {
    busy = false;
  }
}

async function playAgain() {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/play-again", { method: "POST" });
    const data = await res.json();
    if (!res.ok) { $("feedback").textContent = data.error; return; }
    scale = 1;
    follow = true;
    expandedOnce = false;
    $("follow").setAttribute("aria-pressed", "true");
    render(data.view);
    $("feedback").className = "";
    $("feedback").textContent = `New game. ${openingPrompt(data.view)}`;
  } finally {
    busy = false;
  }
}

function inProgress(view) {
  return view.completed || view.lineage.some(
    (stage) => stage.tiers.some((tier) => tier.species.length),
  );
}

async function setDifficulty(difficulty) {
  if (busy || !currentView || difficulty === currentView.difficulty) return;
  // A difficulty decides which cards a stage deals, so the switch restarts
  // this target rather than reinterpreting a position reached without them.
  if (inProgress(currentView) &&
      !confirm("Switching difficulty restarts this target. Continue?")) return;
  busy = true;
  try {
    const res = await fetch("/api/difficulty", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ difficulty }),
    });
    const data = await res.json();
    if (!res.ok) { $("feedback").textContent = data.error; return; }
    scale = 1;
    follow = true;
    expandedOnce = false;
    $("follow").setAttribute("aria-pressed", "true");
    render(data.view);
    $("feedback").className = "";
    $("feedback").textContent = openingPrompt(data.view);
  } finally {
    busy = false;
  }
}

async function continueStage() {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/continue", { method: "POST" });
    const data = await res.json();
    if (!res.ok) { $("feedback").textContent = data.error; return; }
    render(data.view);
    $("feedback").className = "";
    $("feedback").textContent = "Find the closest relative.";
  } finally {
    busy = false;
  }
}

for (const button of document.querySelectorAll(".difficulty button")) {
  button.onclick = () => setDifficulty(button.dataset.difficulty);
}

$("zoom-in").onclick = () => { scale = Math.min(2, scale + 0.15); applyScale(); };
$("zoom-out").onclick = () => { scale = Math.max(0.25, scale - 0.15); applyScale(); };
$("fit").onclick = () => {
  const svg = $("stage-tree").querySelector("svg");
  if (!svg) return;
  follow = false;
  $("follow").setAttribute("aria-pressed", "false");
  const widthScale = ($("stage-tree").clientWidth - 24) / svg.viewBox.baseVal.width;
  const heightScale = ($("stage-tree").clientHeight - 24) / svg.viewBox.baseVal.height;
  scale = Math.min(widthScale, heightScale);
  applyScale();
};
$("follow").onclick = () => {
  follow = !follow;
  $("follow").setAttribute("aria-pressed", String(follow));
  if (follow) { scale = 1; applyScale(); }
};

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentView) renderTree(currentView);
  }, 100);
});

fetch("/api/view").then((r) => r.json()).then((view) => {
  render(view);
  $("feedback").textContent = openingPrompt(view);
});
</script>
</body>
</html>
