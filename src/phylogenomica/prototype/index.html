<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phylogenomica</title>
<style>
  :root {
    --bg: #0e1218; --panel: #161c25; --line: #253044; --ink: #e7ecf3;
    --muted: #8f9cb0; --faint: #4a5568; --accent: #6ea8fe;
    --good: #58c98a; --warn: #e0a458;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --line: #d7dee8; --ink: #16202e;
      --muted: #5d6b7f; --faint: #a6b1c0; --accent: #2c6fd1;
      --good: #1f8a55; --warn: #9a5f0d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: baseline;
    padding: .7rem 1.1rem; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: 0 0 auto;
  }
  h1 { font-size: .95rem; margin: 0; letter-spacing: .09em; text-transform: uppercase; }
  h1 span { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .stats { display: flex; gap: 1.4rem; margin-left: auto; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat small { color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; }

  /* The tree is the board: it takes every pixel the chrome does not need.
     The overlays sit on the wrapper, so they stay put while the tree scrolls. */
  #board { flex: 1 1 auto; position: relative; min-height: 0; }
  #stage-tree { position: absolute; inset: 0; overflow: auto; display: flex; }
  /* auto margins centre the tree without clipping it once it outgrows the box.
     flex: 0 0 auto is load-bearing: a flex item would otherwise shrink to fit
     the container instead of overflowing into a scroll, silently shrinking the
     whole cladogram as stages accumulate. */
  #stage-tree svg { display: block; margin: auto; flex: 0 0 auto; }
  .empty { margin: auto; color: var(--muted); font-style: italic; }
  .controls {
    position: absolute; top: .6rem; right: .8rem; z-index: 3; display: flex; gap: .3rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: .4rem; padding: .2rem;
  }
  .controls button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .78rem;
    padding: .2rem .5rem; border-radius: .25rem; cursor: pointer;
  }
  .controls button:hover { color: var(--ink); background: var(--bg); }
  .controls button[aria-pressed="true"] { color: var(--accent); background: var(--bg); }

  .legend {
    position: absolute; bottom: .6rem; left: .8rem; z-index: 3; display: flex;
    flex-wrap: wrap; gap: .1rem .8rem; font-size: .7rem; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: .4rem; padding: .35rem .6rem; max-width: 30rem;
  }
  .legend i { font-style: normal; color: var(--ink); }

  footer {
    flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel);
    padding: .6rem .9rem .75rem;
  }
  #feedback {
    margin: 0 0 .55rem; padding: .4rem .7rem; border-radius: .4rem;
    border: 1px solid var(--line); background: var(--bg); font-size: .88rem;
    font-variant-numeric: tabular-nums;
  }
  #feedback.good { border-color: var(--good); }
  #feedback.cost { border-color: var(--warn); }
  #cards { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .2rem; }
  .card {
    flex: 1 1 0; min-width: 7rem; display: flex; gap: .5rem; align-items: center;
    text-align: left; padding: .4rem; border: 1px solid var(--line); border-radius: .45rem;
    background: var(--bg); color: inherit; font: inherit; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .card:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
  .card:disabled { cursor: default; opacity: .4; }
  .thumb {
    flex: 0 0 auto; width: 2.2rem; height: 2.2rem; border-radius: .3rem; overflow: hidden;
    background: linear-gradient(160deg, var(--line), var(--panel));
    display: grid; place-items: center; font-size: 1.1rem; color: var(--muted);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .en { font-weight: 600; font-size: .85rem; line-height: 1.2; }
  .sci { font-style: italic; color: var(--muted); font-size: .74rem; line-height: 1.2; }
  .meta { min-width: 0; }
  .meta > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .en { white-space: normal; overflow-wrap: anywhere; }
  .again {
    margin-left: .5rem; padding: .45rem .9rem; border-radius: .4rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>Phylogenomica <span id="stage"></span></h1>
  <div class="stats">
    <div class="stat"><b id="score">0</b><small>banked</small></div>
    <div class="stat"><b id="stake">0</b><small>at stake</small></div>
    <div class="stat"><b id="best">0</b><small>best possible</small></div>
  </div>
</header>

<div id="board">
  <div class="controls">
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="fit">Fit all</button>
    <button id="follow" aria-pressed="true">Follow</button>
  </div>
  <div class="legend">
    <span>● <i>inferred</i> — you placed it</span>
    <span>○ <i>revealed</i> — the game placed it</span>
    <span>— <i>resolved</i></span>
    <span>--- <i>unresolved</i></span>
    <span>⌐ <i>polytomy</i> — one event, no order</span>
  </div>
  <div id="stage-tree"></div>
</div>

<footer>
  <p id="feedback">Pick the card whose most recent common ancestor with the hidden target is the newest.</p>
  <div id="cards"></div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const COL = 215, ROW = 38, STUB = 24, BASE = 58, PAD = 132;
let scale = 1, follow = true, busy = false;

function el(name, attrs = {}) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

function text(x, y, value, cls, anchor) {
  const node = el("text", { x, y, class: cls });
  if (anchor) node.setAttribute("text-anchor", anchor);
  node.textContent = value;
  return node;
}

// SVG has no text wrapping, so clip to the column width by character estimate.
function fit(value, maxPx, perChar) {
  const max = Math.floor(maxPx / perChar);
  return value.length <= max ? value : value.slice(0, Math.max(1, max - 1)) + "…";
}

// Ages span 4000 Ma to under 1 Ma, so significant figures beat fixed decimals.
function formatAge(age) {
  // Source ages carry artefacts like 25.000001, so round before trimming.
  if (age >= 100) return `${Math.round(age)} Ma`;
  if (age >= 10) return `${Number(age.toFixed(1))} Ma`;
  return `${Number(age.toPrecision(2))} Ma`;
}

function columns(view) {
  const cols = [];
  for (const stage of view.lineage) {
    for (const tier of stage.tiers) {
      cols.push({
        stage: stage.stage_index, tier: tier.tier_index,
        age: tier.age_ma, species: tier.species,
      });
    }
  }
  return cols;
}

function renderTree(view) {
  const host = $("stage-tree");
  for (const old of host.querySelectorAll("svg, .empty")) old.remove();

  const cols = columns(view);
  if (!cols.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "The tree grows here as you place relatives.";
    host.appendChild(empty);
    return;
  }

  // Branches alternate above and below the trunk, so neighbouring columns
  // never collide and the trunk stays centred.
  let maxUp = 1, maxDown = 1;
  cols.forEach((col, i) => {
    if (i % 2 === 0) maxUp = Math.max(maxUp, col.species.length);
    else maxDown = Math.max(maxDown, col.species.length);
  });
  const trunkY = 40 + BASE + maxUp * ROW;
  const height = trunkY + BASE + maxDown * ROW + 46;
  const width = PAD + cols.length * COL + COL + PAD;

  const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, width, height });
  svg.appendChild(styleBlock());

  const lastX = PAD + (cols.length - 1) * COL;
  const endX = lastX + COL;

  // Resolved trunk, then the unresolved continuation toward the target.
  svg.appendChild(el("line", { x1: 24, y1: trunkY, x2: lastX, y2: trunkY, class: "trunk" }));
  svg.appendChild(el("circle", { cx: 24, cy: trunkY, r: 4, class: "node" }));
  svg.appendChild(text(24, trunkY - 14, "Life", "en"));
  svg.appendChild(el("line", {
    x1: lastX, y1: trunkY, x2: endX - 12, y2: trunkY,
    class: view.completed ? "trunk" : "trunk unresolved",
  }));

  let seenStage = -1;
  cols.forEach((col, i) => {
    const x = PAD + i * COL;
    const dir = i % 2 === 0 ? -1 : 1;

    if (col.stage !== seenStage) {
      seenStage = col.stage;
      svg.appendChild(el("line", {
        x1: x - COL / 2, y1: 14, x2: x - COL / 2, y2: height - 14, class: "divider",
      }));
      svg.appendChild(text(x - COL / 2 + 8, 26, `STAGE ${col.stage + 1}`, "stagelabel"));
    }

    const ys = col.species.map((_, k) => trunkY + dir * (BASE + k * ROW));
    const far = ys[ys.length - 1];
    svg.appendChild(el("line", { x1: x, y1: trunkY, x2: x, y2: far, class: "riser" }));

    const polytomy = col.species.length > 1;
    svg.appendChild(el("circle", {
      cx: x, cy: trunkY, r: polytomy ? 5 : 3.5,
      class: polytomy ? "node polytomy" : "node",
    }));
    let label = polytomy
      ? `tier ${col.tier} · ${col.species.length} spp`
      : `tier ${col.tier}`;
    if (col.age !== null && col.age !== undefined) label += ` · ${formatAge(col.age)}`;
    svg.appendChild(text(x + 7, trunkY + (dir === -1 ? 16 : -8), label, "tierlabel"));

    col.species.forEach((sp, k) => {
      const y = ys[k];
      svg.appendChild(el("line", { x1: x, y1: y, x2: x + STUB, y2: y, class: "branch" }));
      svg.appendChild(el("circle", {
        cx: x + STUB, cy: y, r: 4,
        class: `tip ${sp.placement}${sp.role === "target" ? " target" : ""}`,
      }));
      const labelX = x + STUB + 9;
      const room = COL - STUB - 22;
      const en = text(labelX, y - 1, fit(sp.english_name, room, 6.3), `en ${sp.role}`);
      en.appendChild(el("title")).textContent = `${sp.english_name} — ${sp.role}, ${sp.placement}`;
      svg.appendChild(en);
      svg.appendChild(text(labelX, y + 12, fit(sp.scientific_name, room, 5.7), "sci"));
    });
  });

  // The endpoint: the revealed target, or the concealed continuation.
  const targets = view.lineage.flatMap((s) => s.target);
  if (targets.length) {
    const sp = targets[0];
    svg.appendChild(el("circle", { cx: endX - 12, cy: trunkY, r: 6, class: "tip target guessed" }));
    svg.appendChild(text(endX - 12, trunkY - 16, sp.english_name, "en target", "middle"));
    svg.appendChild(text(endX - 12, trunkY + 24, sp.scientific_name, "sci", "middle"));
  } else {
    svg.appendChild(text(endX - 4, trunkY + 5, "???", "unknown"));
  }

  host.appendChild(svg);
  applyScale();
}

function styleBlock() {
  const style = el("style");
  style.textContent = `
    .trunk { stroke: var(--accent); stroke-width: 2.5; }
    .trunk.unresolved { stroke: var(--faint); stroke-dasharray: 6 6; }
    .riser, .branch { stroke: var(--line); stroke-width: 1.6; }
    .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; }
    .node { fill: var(--accent); }
    .node.polytomy { fill: none; stroke: var(--accent); stroke-width: 2; }
    .tip { fill: var(--bg); stroke: var(--faint); stroke-width: 2; }
    .tip.guessed { fill: var(--accent); stroke: var(--accent); }
    .tip.target { fill: var(--good); stroke: var(--good); }
    text { font: 11.5px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
    .en { font-weight: 600; }
    .en.mulligan { fill: var(--warn); }
    .en.unlock, .en.target { fill: var(--good); }
    .sci { font-size: 10px; font-style: italic; fill: var(--muted); }
    .tierlabel, .stagelabel { font-size: 9.5px; fill: var(--muted); letter-spacing: .06em; }
    .unknown { font-size: 15px; fill: var(--muted); font-style: italic; }
    /* Zoomed far out, labels are unreadable noise: show structure instead. */
    .compact .en, .compact .sci, .compact .tierlabel { display: none; }
    .compact .stagelabel { font-size: 22px; }
  `;
  return style;
}

function applyScale() {
  const svg = $("stage-tree").querySelector("svg");
  if (!svg) return;
  const box = svg.viewBox.baseVal;
  svg.setAttribute("width", box.width * scale);
  svg.setAttribute("height", box.height * scale);
  svg.classList.toggle("compact", scale < 0.55);
  if (follow) $("stage-tree").scrollLeft = $("stage-tree").scrollWidth;
}

function cardNode(card) {
  const node = document.createElement("button");
  node.className = "card";
  node.disabled = card.state !== "active" || busy;

  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.alt = "";
  img.src = card.image_url;
  // The snapshot's media host refuses hotlinked requests, so degrade to a glyph.
  img.onerror = () => { thumb.textContent = "🧬"; };
  thumb.appendChild(img);

  const meta = document.createElement("div");
  meta.className = "meta";
  const en = document.createElement("div");
  en.className = "en";
  en.textContent = card.english_name;
  const sci = document.createElement("div");
  sci.className = "sci";
  sci.textContent = card.scientific_name;
  meta.append(en, sci);
  node.append(thumb, meta);
  node.title = `${card.english_name} — ${card.scientific_name}`;
  if (card.state === "active") node.onclick = () => guess(card.species_id);
  return node;
}

function render(view, outcome) {
  $("score").textContent = view.score;
  $("stake").textContent = view.stage_at_stake;
  $("best").textContent = `${view.best_achievable}/${view.maximum}`;
  $("stage").textContent = view.completed
    ? "complete"
    : `stage ${view.stage_index + 1} of ${view.stage_count}`;

  const cards = $("cards");
  cards.innerHTML = "";
  // Only cards still in play are shown; placed ones now live on the tree.
  for (const card of view.cards.filter((c) => c.state === "active")) {
    cards.appendChild(cardNode(card));
  }
  if (view.completed) {
    const again = document.createElement("button");
    again.className = "again";
    again.textContent = "Play this game again";
    again.onclick = reset;
    cards.appendChild(again);
  }

  renderTree(view);
  if (outcome) describe(outcome, view);
  else if (view.completed) {
    $("feedback").className = "good";
    $("feedback").textContent = `Final score ${view.score} of ${view.maximum}.`;
  }
}

function describe(outcome, view) {
  const box = $("feedback");
  box.className = "";
  const revealed = outcome.placed.filter((p) => p.placement === "revealed").length;
  if (outcome.game_completed) {
    box.classList.add("good");
    box.textContent = `That was the target. Final score ${view.score} of ${view.maximum}.`;
  } else if (outcome.stage_completed) {
    box.classList.add("good");
    box.textContent =
      `Correct — the deepest branch. Stage scored ${outcome.stage_score}. Descending.`;
  } else if (outcome.role === "mulligan") {
    box.classList.add("good");
    box.textContent =
      `So close — second deepest. The +1 bonus cancels the guess, so this costs nothing. ` +
      `${outcome.remaining} card(s) left.`;
  } else {
    box.classList.add("cost");
    box.textContent =
      `More distant than the answer. −${outcome.penalty} ` +
      (revealed
        ? `(itself plus ${revealed} relative(s) it exposed as more distant). `
        : "(nothing else was exposed). ") +
      `${outcome.remaining} card(s) left.`;
  }
}

async function guess(speciesId) {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/guess", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ species_id: speciesId }),
    });
    const data = await res.json();
    if (!res.ok) { $("feedback").textContent = data.error; return; }
    busy = false;
    render(data.view, data.outcome);
  } finally {
    busy = false;
  }
}

async function reset() {
  const res = await fetch("/api/reset", { method: "POST" });
  const data = await res.json();
  $("feedback").className = "";
  $("feedback").textContent = "New attempt at the same game.";
  render(data.view);
}

$("zoom-in").onclick = () => { scale = Math.min(2, scale + 0.15); applyScale(); };
$("zoom-out").onclick = () => { scale = Math.max(0.25, scale - 0.15); applyScale(); };
$("fit").onclick = () => {
  const svg = $("stage-tree").querySelector("svg");
  if (!svg) return;
  follow = false;
  $("follow").setAttribute("aria-pressed", "false");
  scale = ($("stage-tree").clientWidth - 24) / svg.viewBox.baseVal.width;
  applyScale();
};
$("follow").onclick = () => {
  follow = !follow;
  $("follow").setAttribute("aria-pressed", String(follow));
  if (follow) { scale = 1; applyScale(); }
};

fetch("/api/view").then((r) => r.json()).then(render);
</script>
</body>
</html>
