[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylogenomica"
version = "0.1.0"
description = "A phylogenetic tree trivia and deduction game"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Phylogenomica contributors" }]
dependencies = []

[project.scripts]
phylogenomica-download-onezoom = "phylogenomica.data.onezoom_download:main"
phylogenomica-extract-onezoom-docker = "phylogenomica.data.onezoom_docker:main"
phylogenomica-ingest-onezoom = "phylogenomica.data.onezoom_ingest:main"
phylogenomica-audit = "phylogenomica.data.audit:main"
phylogenomica-build-tree = "phylogenomica.tree.preprocess:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
