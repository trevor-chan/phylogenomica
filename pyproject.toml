[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylogenomica"
version = "0.1.0"
description = "A phylogenetic tree trivia and deduction game"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Phylogenomica contributors" }]
dependencies = []

[project.scripts]
phylogenomica-download-onezoom = "phylogenomica.data.onezoom_download:main"
phylogenomica-extract-onezoom-docker = "phylogenomica.data.onezoom_docker:main"
phylogenomica-ingest-onezoom = "phylogenomica.data.onezoom_ingest:main"
phylogenomica-audit = "phylogenomica.data.audit:main"
phylogenomica-build-tree = "phylogenomica.tree.preprocess:main"
phylogenomica-lineage = "phylogenomica.tree.query:main"
phylogenomica-audit-targets = "phylogenomica.generation.feasibility:main"
phylogenomica-build-eligibility = "phylogenomica.generation.eligibility:main"
phylogenomica-select-relatives = "phylogenomica.generation.selection:main"
phylogenomica-generate-game = "phylogenomica.generation.game:main"
phylogenomica-play = "phylogenomica.gameplay.engine:main"
phylogenomica-prototype = "phylogenomica.prototype.server:main"
phylogenomica-resolve-wikimedia = "phylogenomica.data.wikimedia:main"
phylogenomica-resolve-wikipedia = "phylogenomica.data.wikipedia:main"
phylogenomica-download-wikimedia = "phylogenomica.data.wikimedia_download:main"
phylogenomica-update-wikimedia-library = "phylogenomica.data.wikimedia_library:main"
phylogenomica-update-wikipedia-library = "phylogenomica.data.wikipedia_library:main"
phylogenomica-review-wikimedia = "phylogenomica.data.wikimedia_review:main"
phylogenomica-evaluate-wikimedia-rights = "phylogenomica.data.wikimedia_rights:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phylogenomica.prototype" = ["*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
